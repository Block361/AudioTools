name: Windows build and tests
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  native:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - name: Build, test and package native applications
        shell: powershell
        run: ./build.ps1 -BuildDirectory build/ci -Test -Package
      - name: Test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: Windows-test-results
          path: build/ci/Testing/Temporary/LastTest.log
      - name: Native applications
        uses: actions/upload-artifact@v7
        with:
          name: OpenAoIP-Windows-packages
          path: build/ci/packages/*.zip
